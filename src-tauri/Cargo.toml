[package]
name = "petx-desktop"
version = "0.1.0"
description = "A tiny cross-platform PetX desktop companion"
authors = ["IchenDEV"]
edition = "2021"

[lib]
name = "petx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-autostart = "2"
